<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register a student</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D47A1}a:hover{color:#0A3A85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F7FB; font-family: Nunito, system-ui, sans-serif; color: #0F172A;">
  <div style="padding: 54px 16px 0; display: flex; align-items: center; justify-content: space-between;">
    <a href="ReceptionToday.dc.html" style="display: inline-flex; align-items: center; height: 44px; font-size: 16px; font-weight: 700; text-decoration: none;">Cancel</a>
    <span style="font-size: 16px; font-weight: 800;">New student</span>
    <span style="width: 52px;"></span>
  </div>
  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <div style="height: 4px; border-radius: 2px; background: #0D47A1;"></div>
      <div style="height: 4px; border-radius: 2px; background: #CBD5E1;"></div>
      <div style="height: 4px; border-radius: 2px; background: #CBD5E1;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: #64748B;"><span style="color: #0D47A1;">1 Identity</span><span>2 Contact</span><span>3 Enrol</span></div>

    <div style="background: #0F172A; border-radius: 20px; padding: 14px; display: flex; gap: 12px; align-items: center;">
      <div style="width: 112px; height: 72px; border-radius: 10px; background: #1E293B; border: 2px solid #86EFAC; box-sizing: border-box; padding: 8px; display: flex; gap: 6px; flex-shrink: 0;">
        <div style="width: 26px; height: 32px; border-radius: 4px; background: #334155;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
          <div style="height: 5px; border-radius: 3px; background: #475569;"></div>
          <div style="height: 5px; width: 70%; border-radius: 3px; background: #475569;"></div>
          <div style="height: 5px; width: 85%; border-radius: 3px; background: #475569;"></div>
        </div>
      </div>
      <div style="flex-grow: 1; color: #FFFFFF;">
        <div style="font-size: 15px; font-weight: 800;">Civil ID scanned</div>
        <div style="font-size: 13px; color: #CBD5E1;">Front and back · details filled in below — check them</div>
        <a href="#" style="display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 800; color: #93C5FD; text-decoration: none;">Scan again</a>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #DCFCE7; color: #166534; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
      No existing student has this Civil ID or phone
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 4px 14px;">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-bottom: 1px solid #EEF2F7;">
        <label for="fn" style="font-size: 12px; font-weight: 800; color: #64748B;">Full name <span style="color: #0D47A1;">· from ID</span></label>
        <input id="fn" value="MARIA CLARA SANTOS" style="border: 0; outline: none; padding: 0; font-family: inherit; font-size: 16px; font-weight: 700; color: #0F172A;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-bottom: 1px solid #EEF2F7;">
        <label for="cid" style="font-size: 12px; font-weight: 800; color: #64748B;">Civil ID number <span style="color: #0D47A1;">· from ID</span></label>
        <input id="cid" value="2900 •••• ••12" style="border: 0; outline: none; padding: 0; font-family: inherit; font-size: 16px; font-weight: 700; color: #0F172A;">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 10px 0; border-bottom: 1px solid #EEF2F7;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <label for="dob" style="font-size: 12px; font-weight: 800; color: #64748B;">Date of birth</label>
          <input id="dob" value="14 Feb 1996" style="border: 0; outline: none; padding: 0; font-family: inherit; font-size: 16px; font-weight: 700; color: #0F172A;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <label for="nat" style="font-size: 12px; font-weight: 800; color: #64748B;">Nationality</label>
          <input id="nat" value="Philippines" style="border: 0; outline: none; padding: 0; font-family: inherit; font-size: 16px; font-weight: 700; color: #0F172A;">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #EEF2F7;">
        <span style="font-size: 12px; font-weight: 800; color: #64748B;">Gender</span>
        <div role="group" aria-label="Gender" style="display: flex; background: #EEF2F7; border-radius: 10px; padding: 3px;">
          <button type="button" aria-pressed="true" style="flex: 1; height: 34px; border: 0; border-radius: 8px; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 14px; font-weight: 800; box-shadow: 0 1px 3px rgba(15,23,42,0.12);">Female</button>
          <button type="button" style="flex: 1; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #475569; font-family: inherit; font-size: 14px; font-weight: 700;">Male</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0;">
        <div style="width: 48px; height: 48px; border-radius: 24px; background: #E8F0FC; color: #0D47A1; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;">MS</div>
        <div style="flex-grow: 1;"><div style="font-size: 15px; font-weight: 800;">Student photo</div><div style="font-size: 13px; color: #64748B;">Taken from the Civil ID</div></div>
        <button type="button" style="height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-family: inherit; font-size: 14px; font-weight: 800;">Take new</button>
      </div>
    </div>
  </div>

  <div data-bottom style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 12px 20px 30px;">
    <button type="button" style="width: 100%; height: 52px; border-radius: 16px; border: 0; background: #0D47A1; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer;">Continue — contact details</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
