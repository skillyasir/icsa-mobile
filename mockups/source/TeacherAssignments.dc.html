    </div>
    <div style="background: #FFFFFF; border: 2px solid #0D47A1; border-radius: 18px; padding: 12px 14px;">
      <div style="display: flex; justify-content: space-between;"><span style="font-size: 15px; font-weight: 800;">Maria Santos</span><span style="font-size: 12px; color: #64748B; font-weight: 700;">2 Nov 2026 · 9:14 PM</span></div>

    </div>
    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 12px 14px;">
      <div style="display: flex; justify-content: space-between;"><span style="font-size: 15px; font-weight: 800;">Joel Reyes</span><span style="font-size: 12px; color: #64748B; font-weight: 700;">2 Nov 2026 · 6:02 PM</span></div>

    <div>
      <div style="font-size: 20px; font-weight: 800;">Review — Maria Santos</div>

    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
